[tool.poetry]
name = "bnw-utils"
version = "0.0.1"
description = ""
authors = ["Pascal Brogle <pascal.brogle@husqvarnagroup.com>"]
packages = [{include = "bnw", from = "src"}]
include = [
    { path = '**/py.typed' },
]

[tool.poetry.dependencies]
# We explicitly allow specific Python versions. Python >=3.13 is not supported yet and would result in errors.
python = ">=3.10,<3.15"

[tool.poetry.group.dev.dependencies]
bnw-tfw-pytest = { path = "../tfw/bnw-tfw-pytest", develop = true }
bnw-tfw-gateway-components = { path = "../tfw/bnw-tfw-gateway-components", develop = true }

pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"

freezegun = "^1.1.0"
types-freezegun = "^1.1.1"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poetry-dynamic-versioning]
enable = false # enabled on CI, disabled for local development to reduce peotry lock file changes

[tool.poetry-monorepo-dependency-plugin]
enable = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"