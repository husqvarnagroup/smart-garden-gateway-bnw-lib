[tool.poetry]
name = "bnw-tfw-components"
version = "0.0.1"
description = ""
authors = ["Pascal Brogle <pascal.brogle@husqvarnagroup.com>"]
packages = [{include = "bnw", from = "src"}]
include = [
    { path = '**/py.typed' },
]

[tool.poetry.dependencies]
# We explicitly allow specific Python versions. Python >=3.13 is not supported yet and would result in errors.
python = ">=3.10,<3.15"


amqtt = { version = "0.12.0" }
pexpect = { git = "https://github.com/husqvarnagroup/pexpect.git", branch = "gardena/master/2023-11-15" }
cryptography = { version = "46.0.7" }
aiohttp = { version = "^3.8.0" }
mergedeep = { version = "^1.3.4" }


[tool.poetry.group.dev.dependencies]
bnw-activity = { path = "../../activity", develop = true }
bnw-tfw-fixtures = { path = "../bnw-tfw-fixtures", develop = true }
bnw-tfw-pytest = { path = "../bnw-tfw-pytest", develop = true }

# for manufacturing test against lwm2mserver
#bnw-tfw-layer-gateway = { path = "../bnw-tfw-layer-gateway", develop = true }

pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
pytest-aiohttp = "^0.3.0"

boto3 = "^1.28.10"
paho-mqtt = "^2.1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poetry-dynamic-versioning]
enable = false # enabled on CI, disabled for local development to reduce peotry lock file changes

[tool.poetry-monorepo-dependency-plugin]
enable = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
