[tool.poetry]
name = "bnw-tfw-device-components"
version = "0.0.1"
description = ""
authors = ["Pascal Brogle <pascal.brogle@husqvarnagroup.com>"]
packages = [{include = "bnw", from = "src"}]
include = [
    { path = '**/py.typed' },
    { path = 'bnw/tfw/device/component/harness/_lwm2m/lwm2m-object-definitions.json' },
]

[tool.poetry.dependencies]
# We explicitly allow specific Python versions. Python >=3.13 is not supported yet and would result in errors.
python = ">=3.10,<3.15"

bnw-tfw-components = { path = "../bnw-tfw-components", develop = true }
bnw-transport-coap = { path = "../../transport/bnw-transport-coap", develop = true}

netifaces = ">=0.10.9"
cbor2 = "^5.6.3"

[tool.poetry.group.dev.dependencies]
bnw-activity = { path = "../../activity", develop = true }
bnw-tfw-components = { path = "../../tfw/bnw-tfw-components", develop = true }
bnw-tfw-fixtures = { path = "../../tfw/bnw-tfw-fixtures", develop = true }
bnw-tfw-gateway-components = { path = "../../tfw/bnw-tfw-gateway-components", develop = true }
bnw-tfw-gateway-fixtures = { path = "../../tfw/bnw-tfw-gateway-fixtures", develop = true }

pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poetry-dynamic-versioning]
enable = false # enabled on CI, disabled for local development to reduce peotry lock file changes

[tool.poetry-monorepo-dependency-plugin]
enable = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
