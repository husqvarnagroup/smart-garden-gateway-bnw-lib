[tool.poetry]
name = "bnw-activity"
version = "0.0.1"
description = ""
authors = ["Pascal Brogle <pascal.brogle@husqvarnagroup.com>"]
packages = [{include = "bnw", from = "src"}]
include = [
    { path = '**/py.typed' },
]

[tool.poetry.dependencies]
# We explicitly allow specific Python versions. Python >=3.13 is not supported yet and would result in errors.
python = ">=3.10,<3.15"

bnw-protocol = { path = "../protocol", develop = true }
bnw-transport-mqtt = { path = "../transport/bnw-transport-mqtt", develop = true }
bnw-transport-unix = { path = "../transport/bnw-transport-unix", develop = true }

[tool.poetry.group.dev.dependencies]
bnw-tfw-fixtures = { path = "../tfw/bnw-tfw-fixtures", develop = true }
bnw-tfw-gateway-fixtures = { path = "../tfw/bnw-tfw-gateway-fixtures", develop = true }
bnw-tfw-device-fixtures = { path = "../tfw/bnw-tfw-device-fixtures", develop = true }

pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.poetry-dynamic-versioning]
enable = false # enabled on CI, disabled for local development to reduce peotry lock file changes

[tool.poetry-monorepo-dependency-plugin]
enable = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
