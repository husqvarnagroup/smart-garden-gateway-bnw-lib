[tool.poetry]
name = "bnw"
version = "0.0.1"
description = "Stub package used for development purposes (tool dependencies, config, etc)"
authors = ["Pascal Brogle <pascal.brogle@husqvarnagroup.com>"]

[tool.poetry.dependencies]
# We explicitly allow specific Python versions. Python >=3.13 is not supported yet and would result in errors.
python = ">=3.10,<3.15"

[tool.poetry.group.dev.dependencies]
# dev tools
pre-commit = "^2.14.0"
mypy = "^2.1.0"
isort = "^5.12.0"
flake8 = "^7.0.0"
black = "^22.8.0"

# testing
pytest = "^8.3.2"
pytest-mypy = "^1.0.1"
pytest-asyncio = "^0.24.0"
pytest-timeout = "^2.1.0"
types-termcolor = "^1.1.2"
types-setuptools = "^57.4.1"
types-freezegun = "^1.1.1"
types-requests = "^2.26.0"
types-PyYAML = "^6.0.1"

#poetry
poetry = "^2.4.1"
poethepoet = "^0.37.0"
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }
poetry-monorepo-dependency-plugin = { git = "https://github.com/husqvarnagroup/poetry-monorepo-dependency-plugin.git", branch = "gardena/main/2024-07-15" }

[tool.poetry-dynamic-versioning]
enable = false # enabled on CI, disabled for local development to reduce peotry lock file changes

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
lint        = { cmd = "poetry run pre-commit run", help = "Run code checks on modified files"}
lintall     = { cmd = "poetry run pre-commit run --all-files", help = "Run code checks on all files" }

poetryLockAll     = { cmd = 'find . -name pyproject.toml ! -path "*/.venv*/*" -print -execdir poetry lock \;'}
poetryLockNoUpdateAll     = { cmd = 'find . -name pyproject.toml ! -path "*/.venv*/*" -print -execdir poetry lock --no-update \;'}
poetryDynamicVersionAll     = { cmd = 'find . -name pyproject.toml ! -path "*/.venv*/*" -print -execdir poetry dynamic-versioning \;'}

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | _skbuild
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"

[tool.mypy]
show_error_codes = true
exclude = [
    '/conftest\.py$',
]
ignore_missing_imports = true
implicit_optional = true
# We need to set each package src explicitly, otherwise we get duplicate packages due to mypy not being able to find the proper package path
explicit_package_bases = true
mypy_path = "bnw/tfw/bnw-tfw-device-components/src:bnw/tfw/bnw-tfw-pytest/src:bnw/tfw/bnw-tfw-gateway-components/src:bnw/tfw/bnw-tfw-fixtures/src:bnw/tfw/bnw-tfw-device-fixtures/src:bnw/tfw/bnw-tfw-components/src:bnw/tfw/bnw-tfw-gateway-fixtures/src:bnw/tfw/src:bnw/transport/bnw-transport-unix/src:bnw/transport/bnw-transport-mqtt/src:bnw/transport/bnw-transport-base/src:bnw/transport/bnw-transport-coap/src:bnw/activity/src:bnw/pycode/src:bnw/utils/src:bnw/protocol/src"

[[tool.mypy.overrides]]
module = [
    "aiocoap",
    "pytest",
    "bnw.transport.unix.*",
]
ignore_missing_imports = true
disallow_untyped_defs = true
