repos:
  - repo: https://github.com/ambv/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [ "--config-file=pyproject.toml" ]
        exclude: "/conftest\\.py$" # need to exclude files here as well as individual files are passed to mypy, so mypy's exclude mechanism does not take effect
        additional_dependencies: # pre-commit uses its own python env, so need to specify additional packages here as well
          - types-termcolor
          - types-setuptools
          - types-freezegun
          - types-requests
          - types-PyYAML
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
